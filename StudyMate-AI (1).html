<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>StudyMate AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>html{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<style>
/* Layout concept: floating sidebar card + sticky top bar + content grid.
   Logical CSS properties throughout, so Arabic (RTL) mirrors automatically. */
:root{
  --font:"Plus Jakarta Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --bg:#F5F6FC; --surface:#FFFFFF; --surface-2:#EEF0FA; --line:#E1E4F3;
  --fg:#15183A; --muted:#575D86; --faint:#8A90B5;
  --primary:#4F46E5; --primary-ink:#FFFFFF; --primary-soft:#E9E8FD; --primary-line:#C9C6F8;
  --violet:#7C3AED; --blue:#2563EB; --sky:#0EA5E9;
  --good:#047857; --good-soft:#DDF5EA; --warn:#B45309; --warn-soft:#FDF0D5; --bad:#B91C1C; --bad-soft:#FCE3E3;
  --shadow:0 1px 2px rgba(21,24,58,.05),0 10px 28px -14px rgba(21,24,58,.16);
  --scrim:rgba(13,15,40,.45);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D0F24; --surface:#151833; --surface-2:#1D2145; --line:#2A2F5E;
    --fg:#EDEFFF; --muted:#A3A9D4; --faint:#7C83B3;
    --primary:#8B93FF; --primary-ink:#0D0F24; --primary-soft:#232857; --primary-line:#3B4290;
    --violet:#A78BFA; --blue:#60A5FA; --sky:#38BDF8;
    --good:#34D399; --good-soft:#12342B; --warn:#FBBF24; --warn-soft:#3A2D0E; --bad:#F87171; --bad-soft:#3E1A1F;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.65);
    --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0F24; --surface:#151833; --surface-2:#1D2145; --line:#2A2F5E;
  --fg:#EDEFFF; --muted:#A3A9D4; --faint:#7C83B3;
  --primary:#8B93FF; --primary-ink:#0D0F24; --primary-soft:#232857; --primary-line:#3B4290;
  --violet:#A78BFA; --blue:#60A5FA; --sky:#38BDF8;
  --good:#34D399; --good-soft:#12342B; --warn:#FBBF24; --warn-soft:#3A2D0E; --bad:#F87171; --bad-soft:#3E1A1F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.65);
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:8px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}
.ic.rev{transform:scaleX(-1)}
[dir="rtl"] .ic.rev{transform:none}
[dir="rtl"] .ic.fwd{transform:scaleX(-1)}
.num{font-variant-numeric:tabular-nums}

/* shell */
.shell{max-width:1380px;margin:0 auto;padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:252px minmax(0,1fr);gap:24px;align-items:start}
.side{position:sticky;top:16px;margin-top:16px;max-height:calc(100dvh - 32px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 14px;display:flex;flex-direction:column;gap:18px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--primary),var(--violet));color:#fff;display:grid;place-items:center;flex:none}
.brand b{font-size:17px;letter-spacing:-.01em;font-weight:800}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:11px;background:none;color:var(--muted);font-weight:500;text-align:start}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button.on{background:var(--primary-soft);color:var(--primary);font-weight:700}
.side-foot{margin-top:auto;padding:12px 8px 2px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;line-height:1.45}
.scrim{display:none}
.col{min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:16px 12px}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .menu-btn{display:none}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.icon-btn:hover{border-color:var(--primary-line);background:var(--primary-soft)}
.icon-btn.sm{width:32px;height:32px;border-radius:9px;border-color:transparent;background:none;color:var(--muted)}
.icon-btn.sm:hover{background:var(--surface-2);color:var(--fg)}
.icon-btn.danger:hover{background:var(--bad-soft);color:var(--bad)}
.langbtn{display:inline-flex;align-items:center;gap:6px;height:40px;padding-inline:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13.5px}
.langbtn:hover{border-color:var(--primary-line);background:var(--primary-soft)}
.me{display:inline-flex;align-items:center;gap:8px;height:40px;padding-inline:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13.5px;max-width:170px}
.me span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:30px;height:30px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.chip.mini{display:inline-flex;align-items:center;gap:8px;height:40px;padding-inline:14px;border-radius:999px;border:1px solid var(--primary-line);background:var(--primary-soft);color:var(--primary);font-weight:700;font-variant-numeric:tabular-nums}
.chip.mini[hidden]{display:none!important}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--primary);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
main{outline:none;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-content:start}
main.enter{animation:rise .28s ease both}
@keyframes rise{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;margin-bottom:12px}
.card-h h2{font-size:15px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 16px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--primary-line);background:var(--primary-soft)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.danger:hover{filter:brightness(1.08)}
.btn.ghost{background:none;border-color:transparent;color:var(--primary)}
.btn.lg{min-height:48px;padding-inline:26px;font-size:15px;border-radius:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:none}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.page-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-h h2{font-size:20px;font-weight:800;letter-spacing:-.015em}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--surface-2);gap:2px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--primary);box-shadow:0 1px 3px rgba(21,24,58,.12)}
.seg button[disabled]{opacity:.5;cursor:not-allowed}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c,var(--primary));flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 8px;border-radius:999px;font-size:12.5px;font-weight:600;background:color-mix(in srgb,var(--c,var(--faint)) 14%,transparent);color:var(--fg);max-width:100%}
[dir="rtl"] .chip{padding:2px 8px 2px 10px}
.chip.plain{background:var(--surface-2);color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.p-high{background:var(--bad-soft);color:var(--bad)}
.p-medium{background:var(--warn-soft);color:var(--warn)}
.p-low{background:var(--primary-soft);color:var(--primary)}
.s-pending{background:var(--surface-2);color:var(--muted)}
.s-in_progress{background:var(--primary-soft);color:var(--primary)}
.s-completed{background:var(--good-soft);color:var(--good)}
.s-overdue{background:var(--bad-soft);color:var(--bad)}
.banner{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;font-size:14px;font-weight:500;flex-wrap:wrap}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner .btn{min-height:34px;padding:4px 12px;font-size:13px}
.empty{display:grid;justify-items:center;text-align:center;gap:8px;padding:34px 16px;color:var(--muted)}
.empty .ic{width:34px;height:34px;color:var(--faint)}
.empty b{color:var(--fg);font-size:15px}
.empty p{max-width:340px;font-size:13.5px}

/* forms */
.f{display:grid;gap:6px;min-width:0}
.f>label,.f>.lbl{font-size:13px;font-weight:600}
.inp{width:100%;min-height:42px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.inp:hover{border-color:var(--primary-line)}
.inp:focus-visible{outline:2px solid var(--primary);outline-offset:1px;border-color:var(--primary)}
textarea.inp{min-height:84px;resize:vertical}
.err{color:var(--bad);font-size:12.5px;font-weight:500}
.inp.bad{border-color:var(--bad)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fgrid .full{grid-column:1/-1}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches input{position:absolute;opacity:0;pointer-events:none}
.swatches label{width:30px;height:30px;border-radius:50%;background:var(--c);cursor:pointer;display:grid;place-items:center;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatches input:checked+label{box-shadow:0 0 0 2px var(--fg)}
.swatches input:focus-visible+label{outline:2px solid var(--primary);outline-offset:3px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:600;color:var(--muted)}
.quick button:hover{border-color:var(--primary-line);color:var(--primary)}

/* modal */
.mback{position:fixed;inset:0;z-index:40;background:var(--scrim);display:grid;place-items:center;padding:16px}
.dlg{width:min(520px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 60px -20px rgba(0,0,0,.5);animation:rise .22s ease both}
.dlg-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:18px 20px 6px}
.dlg-h h2{font-size:18px;font-weight:800}
.dlg-b{padding:10px 20px 4px;display:grid;gap:14px}
.dlg-f{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:14px 20px 20px}
.dlg-f .left{margin-inline-end:auto}
@media (max-width:600px){
  .mback{place-items:end center;padding:0}
  .dlg{width:100%;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .fgrid{grid-template-columns:1fr}
}
#toasts{position:fixed;inset-inline:0;bottom:0;z-index:50;display:grid;justify-items:center;gap:8px;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));pointer-events:none}
.toast{pointer-events:auto;background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);max-width:min(460px,100%);animation:rise .25s ease both}
.toast.bad{background:var(--bad);color:#fff}

/* dashboard */
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.s4{grid-column:span 4}.s5{grid-column:span 5}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:1/-1}
.hello h2{font-size:28px;font-weight:800;letter-spacing:-.025em;line-height:1.2}
.hello p{margin-top:4px}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px}
.qa .btn{justify-content:flex-start;min-height:46px;background:var(--surface)}
.qa .btn .ic{color:var(--primary)}
.ringwrap{position:relative;display:grid;place-items:center}
.ringwrap .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-bg{fill:none;stroke:var(--surface-2)}
.ring-fg{fill:none;stroke:var(--primary);stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.ring-fg.brk{stroke:var(--sky)}
.big{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
.kpi .lab{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .val{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.2;margin-top:2px}
.kpi .hint{font-size:12.5px;color:var(--muted)}
.list{display:grid;gap:8px}
.li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface-2);min-width:0}
.li .tt{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .sub{font-size:12.5px;color:var(--muted)}
.li.done .tt{text-decoration:line-through;color:var(--muted)}
.li.late{background:var(--bad-soft)}
.check{width:22px;height:22px;border-radius:7px;border:2px solid var(--faint);background:var(--surface);display:grid;place-items:center;flex:none;padding:0;color:transparent}
.check:hover{border-color:var(--primary)}
.check[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.check .ic{width:14px;height:14px;stroke-width:3}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.wk{display:grid;grid-template-columns:repeat(var(--n,7),minmax(0,1fr));gap:8px;align-items:end}
.wk .c{display:grid;gap:6px;justify-items:center;min-width:0}
.wk .v{font-size:11.5px;color:var(--muted);height:16px;font-weight:600;white-space:nowrap}
.wk .tr{height:150px;width:100%;display:flex;align-items:flex-end;justify-content:center;border-radius:10px;background:var(--surface-2)}
.wk .bar{width:min(34px,72%);display:flex;flex-direction:column-reverse;border-radius:8px 8px 3px 3px;overflow:hidden;min-height:0}
.wk .bar i{display:block}
.wk .bar .p{background:var(--primary)}
.wk .bar .fo{background:var(--sky)}
.wk .d{font-size:12px;color:var(--muted);font-weight:600}
.wk .d.today{color:var(--primary);font-weight:800}
.meter{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--c,var(--primary))}

/* planner */
.pl{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.pl.day{grid-template-columns:minmax(0,1fr)}
.dc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0;min-height:150px}
.dc.today{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.dc-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 6px;padding:2px 4px}
.dc-h b{font-size:20px;font-weight:800;line-height:1}
.dc-h span{font-size:12.5px;color:var(--muted);font-weight:600}
.dc-h .tg{flex-basis:100%;font-size:11px;font-weight:800;color:var(--primary);text-transform:uppercase;letter-spacing:.04em}
.sess{display:flex;gap:8px;align-items:flex-start;padding:8px;border-radius:10px;background:color-mix(in srgb,var(--c) 12%,var(--surface));border-inline-start:3px solid var(--c);cursor:pointer;min-width:0}
.sess:hover{background:color-mix(in srgb,var(--c) 20%,var(--surface))}
.sess .b{min-width:0;flex:1}
.sess .tm{font-size:12px;font-weight:700;color:var(--fg)}
.sess .nm{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess .nt{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess.done .nm{text-decoration:line-through;color:var(--muted)}
.dc .add{margin-top:auto;border:1px dashed var(--line);background:none;border-radius:10px;padding:6px;color:var(--muted);font-weight:600;font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:6px}
.dc .add:hover{border-color:var(--primary);color:var(--primary)}
.pl.day .dc{min-height:220px}

/* tasks */
.toolbar{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr));gap:10px;padding:14px}
.searchbox{position:relative}
.searchbox .ic{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.searchbox .inp{padding-inline-start:38px}
.task{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.task.late{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 7%,var(--surface))}
.task.done .ttl{text-decoration:line-through;color:var(--muted)}
.task .b{flex:1;min-width:0;display:grid;gap:6px}
.task .ttl{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.task .ds{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.task .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.task .acts{display:flex;gap:2px;align-items:center;flex:none}
.mini-sel{min-height:32px;padding:3px 8px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:12.5px;font-weight:600}
.duechip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);font-weight:600}
.duechip.late{color:var(--bad)}

/* focus */
.fgrid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
.timer{display:grid;justify-items:center;gap:20px;padding:26px 18px}
.timer .time{font-size:54px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.timer .modelab{font-size:13px;font-weight:700;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.06em}
.ctrls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.set{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%;max-width:380px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--primary)}
.hist{display:grid;gap:6px}
.hist .li{padding:8px 10px}

/* progress / subjects / settings */

<script>
/*LOGIC-START*/
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((parseYmd(a)-parseYmd(b))/864e5);
const startOfWeek=(s,ws)=>addDays(s,-((parseYmd(s).getDay()-ws+7)%7));
const weekDates=(s,ws)=>{const st=startOfWeek(s,ws);return Array.from({length:7},(_,i)=>addDays(st,i))};
const toMin=hm=>{const [h,m]=String(hm).split(':').map(Number);return h*60+m};
const fromMin=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
const sEnd=s=>toMin(s.start)+Number(s.duration);
function findOverlap(sessions,c,ignoreId){
  const cs=toMin(c.start),ce=cs+Number(c.duration);
  return sessions.find(s=>s.id!==ignoreId&&s.date===c.date&&toMin(s.start)<ce&&cs<sEnd(s))||null;
}
function dueAt(task){
  if(!task.dueDate)return null;
  const d=parseYmd(task.dueDate);
  if(task.dueTime){const [h,m]=task.dueTime.split(':').map(Number);d.setHours(h,m,0,0)}else d.setHours(23,59,59,999);
  return d;
}
const isOverdue=(task,now)=>task.status!=='completed'&&!!dueAt(task)&&dueAt(task)<now;
const PR={high:0,medium:1,low:2};
function cmpDue(a,b){const x=dueAt(a),y=dueAt(b);if(x&&y)return x-y;if(!!x!==!!y)return x?-1:1;return 0}
function sortTasks(tasks){
  return [...tasks].sort((a,b)=>{
    const ac=a.status==='completed',bc=b.status==='completed';
    if(ac!==bc)return ac?1:-1;
    return cmpDue(a,b)||((PR[a.priority]??1)-(PR[b.priority]??1))||String(a.title).localeCompare(String(b.title));
  });
}
function filterTasks(tasks,f,now){
  const q=(f.q||'').trim().toLowerCase();
  return tasks.filter(t=>{
    if(f.status==='overdue'){if(!isOverdue(t,now))return false}
    else if(f.status&&f.status!=='all'&&t.status!==f.status)return false;
    if(f.priority&&f.priority!=='all'&&t.priority!==f.priority)return false;
    if(f.subject&&f.subject!=='all'){
      if(f.subject==='_'){if(t.subjectId)return false}else if(t.subjectId!==f.subject)return false;
    }
    if(q&&!(((t.title||'')+' '+(t.description||'')).toLowerCase().includes(q)))return false;
    return true;
  });
}
function dailyCompletion(sessions,tasks,today){
  const ss=sessions.filter(s=>s.date===today),tt=tasks.filter(t=>t.dueDate===today);
  const total=ss.length+tt.length;
  const done=ss.filter(s=>s.completed).length+tt.filter(t=>t.status==='completed').length;
  return {done,total,pct:total?Math.round(done/total*100):null};
}
function minutesByDate(sessions,focus){
  const m={};const add=(d,k,v)=>{(m[d]=m[d]||{planned:0,focus:0})[k]+=v};
  sessions.forEach(s=>{if(s.completed)add(s.date,'planned',Number(s.duration)||0)});
  focus.forEach(f=>add(f.date,'focus',Number(f.minutes)||0));
  return m;
}
function rangeMinutes(byDate,from,to){
  let p=0,f=0;
  for(const d in byDate){if(d>=from&&d<=to){p+=byDate[d].planned;f+=byDate[d].focus}}
  return {planned:p,focus:f,total:p+f};
}
function subjectMinutes(sessions,focus,from,to){
  const m={};const add=(id,v)=>{const k=id||'_';m[k]=(m[k]||0)+v};
  sessions.forEach(s=>{if(s.completed&&s.date>=from&&s.date<=to)add(s.subjectId,Number(s.duration)||0)});
  focus.forEach(f=>{if(f.date>=from&&f.date<=to)add(f.subjectId,Number(f.minutes)||0)});
  return m;
}
function weeklyTotals(byDate,today,ws,n){
  const cur=startOfWeek(today,ws),out=[];
  for(let i=n-1;i>=0;i--){const st=addDays(cur,-7*i);out.push({start:st,total:rangeMinutes(byDate,st,addDays(st,6)).total})}
  return out;
}
function validateSession(f,sessions,id){
  const e={};
  if(!f.subjectId)e.subjectId='needSubject';
  if(!f.date)e.date='required';
  if(!/^\d{2}:\d{2}$/.test(f.start||''))e.start='required';
  const d=Number(f.duration);
  if(!Number.isFinite(d)||d<5||d>480||Math.round(d)!==d)e.duration='durRange';
  if(!e.start&&!e.duration&&toMin(f.start)+d>1440)e.start='pastMidnight';
  if(!e.start&&!e.duration&&!e.date){const o=findOverlap(sessions,{date:f.date,start:f.start,duration:d},id);if(o){e.start='overlap';e.overlap=o}}
  return e;
}
function validateTask(f){
  const e={};
  if(!f.title||!f.title.trim())e.title='required';else if(f.title.trim().length>120)e.title='titleLong';
  if(!f.dueDate)e.dueDate='required';
  return e;
}
const normEmail=e=>String(e||'').trim().toLowerCase();
const EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
function validateSignup(f){
  const e={},em=normEmail(f.email),p=f.pw||'';
  if(!f.name||f.name.trim().length<2||f.name.trim().length>60)e.name='errName';
  if(!EMAIL_RE.test(em)||em.length>254)e.email='errEmail';
  if(p.length<8||p.length>128)e.pw='errPwShort';
  else if(!/[A-Za-z\u0600-\u06FF]/.test(p)||!/[0-9\u0660-\u0669]/.test(p))e.pw='errPwWeak';
  if(!e.pw&&p!==f.pw2)e.pw2='errPwMatch';
  return e;
}
/*LOGIC-END*/
</script>

/* ================= storage + accounts (this device) ================= */
const MEM={};
const store={
  get(k){try{return localStorage.getItem(k)}catch(e){return k in MEM?MEM[k]:null}},
  set(k,v){try{localStorage.setItem(k,v);return true}catch(e){if(e&&(e.name==='QuotaExceededError'||e.code===22))return false;MEM[k]=v;S.persist=false;return true}},
  del(k){try{localStorage.removeItem(k)}catch(e){}delete MEM[k]}
};
(function(){try{localStorage.setItem('sm.__t','1');localStorage.removeItem('sm.__t')}catch(e){S.persist=false}})();
const cryptoOk=()=>!!(window.crypto&&crypto.subtle&&crypto.getRandomValues);
const rid=n=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return Array.from(a,x=>x.toString(16).padStart(2,'0')).join('')};
const b64=buf=>btoa(String.fromCharCode.apply(null,Array.from(new Uint8Array(buf))));
const unb64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
const ITER=150000;
async function derive(pw,saltB64,iter){
  const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return b64(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:unb64(saltB64),iterations:iter},key,256));
}
const getUsers=()=>{try{const u=JSON.parse(store.get('sm.users')||'{}');return u&&typeof u==='object'?u:{}}catch(e){return {}}};
const saveUsers=u=>store.set('sm.users',JSON.stringify(u));
const setSession=u=>store.set('sm.session',JSON.stringify({uid:u.id}));
const readSession=()=>{try{return JSON.parse(store.get('sm.session')||'null')}catch(e){return null}};
const failKey=e=>'sm.fail.'+e;
function lockLeft(em){try{const o=JSON.parse(store.get(failKey(em))||'null');if(o&&o.until>Date.now())return Math.ceil((o.until-Date.now())/1000)}catch(e){}return 0}
function noteFail(em){let o={n:0,until:0};try{o=JSON.parse(store.get(failKey(em))||'null')||o}catch(e){}o.n=(o.n||0)+1;if(o.n>=5){o.until=Date.now()+60000;o.n=0}store.set(failKey(em),JSON.stringify(o))}
async function doSignUp(f){
  const users=getUsers(),em=normEmail(f.email);
  if(users[em])return {error:'errExists',field:'email'};
  const salt=b64(crypto.getRandomValues(new Uint8Array(16)));
  const hash=await derive(f.pw,salt,ITER);
  const u={id:'u'+rid(10),name:f.name.trim(),email:em,salt,iter:ITER,hash,created:new Date().toISOString()};
  users[em]=u;
  if(!saveUsers(users))return {error:'errQuota'};
  const prof={name:u.name,weekStart:LANG==='ar'?6:1,lang:LANG,theme:THEME,onboarded:true};
  if(!store.set('sm.data.'+u.id,JSON.stringify({profile:prof}))){delete users[em];saveUsers(users);return {error:'errQuota'}}
  return {user:u};
}
async function doLogin(email,pw){
  const em=normEmail(email),left=lockLeft(em);
  if(left)return {error:'errLocked',s:left};
  const u=getUsers()[em];
  const h=await derive(pw,u?u.salt:b64(new Uint8Array(16)),u?u.iter:ITER);
  if(!u||h!==u.hash){noteFail(em);return {error:'errBad'}}
  store.del(failKey(em));
  return {user:u};
}
function eraseUser(u){
  const users=getUsers();delete users[u.email];saveUsers(users);
  store.del('sm.data.'+u.id);store.del('sm.timer.'+u.id);store.del(failKey(u.email));
  const s=readSession();if(s&&s.uid===u.id)store.del('sm.session');
}

/* per-account document store (same shape the views already use) */
function makeDB(uid){
  const key='sm.data.'+uid,clone=o=>JSON.parse(JSON.stringify(o));
  let data={};const ls=new Set(),meta={fromCache:false,hasPendingWrites:false};
  const load=()=>{try{const d=JSON.parse(store.get(key)||'{}');data=d&&typeof d==='object'?d:{}}catch(e){data={}}};
  const persist=()=>{if(!store.set(key,JSON.stringify(data)))throw {code:'quota_exceeded'}};
  const notify=()=>Array.from(ls).forEach(f=>f());
  const snapOf=p=>({id:p.split('/').pop(),exists:p in data,data:()=>p in data?clone(data[p]):undefined,metadata:meta});
  const kids=cp=>Object.keys(data).filter(k=>k.startsWith(cp+'/')&&k.split('/').length===cp.split('/').length+1).sort();
  const sub=(fn)=>{ls.add(fn);setTimeout(fn,0);return()=>ls.delete(fn)};
  function doc(p){return {id:p.split('/').pop(),
    set:async d=>{const had=p in data,old=data[p];data[p]=clone(d);try{persist()}catch(e){if(had)data[p]=old;else delete data[p];throw e}notify()},
    delete:async()=>{delete data[p];persist();notify()},
    onSnapshot:next=>sub(()=>next(snapOf(p))),
    collection:n=>col(p+'/'+n)}}
  function col(p){return {doc:id=>doc(p+'/'+(id||rid(8))),onSnapshot:next=>sub(()=>next({docs:kids(p).map(snapOf)}))}}
  const onStore=e=>{if(e.key===key){load();notify()}};
  window.addEventListener('storage',onStore);load();
  return {doc,col,close(){window.removeEventListener('storage',onStore);ls.clear()}};
}

/* ================= data layer ================= */
let chain=Promise.resolve();
const run=fn=>{const p=chain.then(fn);chain=p.catch(()=>{});return p};
async function write(fn){try{await run(fn);return true}catch(e){errToast(e);return false}}
const col=n=>S.base.collection(n);
function stripId(o){const c={...o};delete c.id;return c}
async function createItem(name,data){if(!S.base)return false;const ref=col(name).doc();return write(()=>ref.set(data))}
async function putItem(name,id,data){return write(()=>col(name).doc(id).set(data))}
async function patchItem(name,id,patch){
  const cur=S[name].find(x=>x.id===id);if(!cur)return false;
  return write(()=>col(name).doc(id).set({...stripId(cur),...patch}));
}
async function removeItem(name,id){return write(()=>col(name).doc(id).delete())}
function saveProfile(patch){
  if(!S.base)return;
  S.profile={...S.profile,...patch};
  write(()=>S.base.set(S.profile));
}

let raf=0;
const schedule=()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;if(S.access==='ok'){renderMain();updateChrome();maybeOnboard()}})};

function startSession(u){
  S.unsubs.forEach(f=>{try{f()}catch(e){}});S.unsubs=[];if(S.db)S.db.close();
  S.me={id:u.id,name:u.name,email:u.email};S.uid=u.id;
  S.db=makeDB(u.id);S.base=S.db.doc('profile');
  Object.assign(S,{profile:{},profileLoaded:false,subjects:[],tasks:[],sessions:[],focus:[],loaded:{},prefsSynced:false,view:'dashboard',onbShown:false,menu:false,
    tf:{q:'',status:'all',priority:'all',subject:'all'},plannerMode:'week',plannerDate:todayStr(),progressDate:todayStr(),access:'ok',slow:false,loadErr:false});
  Object.assign(T,{mode:'focus',status:'idle',endAt:0,subjectId:'',restored:false});T.total=T.remaining=25*60;
  buildShell();renderMain();window.scrollTo(0,0);
  S.unsubs.push(S.base.onSnapshot(snap=>{
    const d=snap.exists?snap.data():{};
    S.profile=d;S.profileLoaded=true;S.loaded.profile=true;
    if(!S.prefsSynced){
      /* first load: the language and theme chosen on this device win, and are saved to the account */
      S.prefsSynced=true;
      if(d.lang!==LANG||d.theme!==THEME)saveProfile({lang:LANG,theme:THEME});
    }else{
      if(d.lang&&d.lang!==LANG&&(d.lang==='ar'||d.lang==='en'))setLang(d.lang,false);
      if(d.theme&&d.theme!==THEME&&['light','dark','system'].includes(d.theme))setTheme(d.theme,false);
    }
    restoreTimer();schedule();
  }));
  ['subjects','tasks','sessions','focus'].forEach(n=>{
    S.unsubs.push(col(n).onSnapshot(snap=>{S[n]=snap.docs.map(d=>({id:d.id,...d.data()}));S.loaded[n]=true;schedule()}));
  });
}
function logout(silent){
  if(S.uid)persistTimer();
  T.status='idle';
  S.unsubs.forEach(f=>{try{f()}catch(e){}});S.unsubs=[];
  if(S.db)S.db.close();
  S.db=null;S.base=null;S.uid=null;S.me=null;S.access='auth';S.authMode='in';S.draft={};
  if(!silent)store.del('sm.session');
  closeModal();renderAuth();
  if(!silent)toast(t('signedOut'));
}
function init(){
  const s=readSession(),u=s&&Object.values(getUsers()).find(x=>x.id===s.uid);
  if(u)startSession(u);else{if(s)store.del('sm.session');S.access='auth';renderAuth()}
}

function clearAuthErrs(){document.querySelectorAll('#authform .err').forEach(e=>e.remove());document.querySelectorAll('#authform .bad:not(.banner)').forEach(e=>e.classList.remove('bad'));const b=$('#authErr');if(b){b.hidden=true;b.textContent=''}}
function showAuthErr(m){const b=$('#authErr');if(b){b.textContent=m;b.hidden=false}}
async function onAuthSubmit(form){
  const up=form.dataset.mode==='up',g=id=>{const el=document.getElementById(id);return el?el.value:''};
  clearAuthErrs();
  const f={name:g('a-name'),email:g('a-email'),pw:g('a-pw'),pw2:g('a-pw2')};
  if(!cryptoOk()){showAuthErr(t('errCrypto'));return}
  const btn=$('#authBtn');btn.disabled=true;
  try{
    if(up){
      const e=validateSignup(f),map={name:'a-name',email:'a-email',pw:'a-pw',pw2:'a-pw2'};
      if(Object.keys(e).length){for(const k in e)setErr(map[k],t(e[k]));const first=document.getElementById(map[Object.keys(e)[0]]);if(first)first.focus();return}
      const r=await doSignUp(f);
      if(r.error){if(r.field==='email')setErr('a-email',t(r.error));else showAuthErr(t(r.error));return}
      setSession(r.user);S.draft={};startSession(r.user);
    }else{
      let bad=false;
      if(!EMAIL_RE.test(normEmail(f.email))){setErr('a-email',t('errEmail'));bad=true}
      if(!f.pw){setErr('a-pw',t('required'));bad=true}
      if(bad)return;
      const r=await doLogin(f.email,f.pw);
      if(r.error){showAuthErr(t(r.error,{s:r.s}));return}
      setSession(r.user);S.draft={};startSession(r.user);
    }
  }catch(err){showAuthErr(t('errSave'))}
  finally{const b2=$('#authBtn');if(b2)b2.disabled=false}
}

function ring(pct,{size=140,stroke=13,id='',cls=''}={}){
  const r=(size-stroke)/2,c=2*Math.PI*r,off=c*(1-Math.min(100,Math.max(0,pct||0))/100),h=size/2;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle class="ring-bg" cx="${h}" cy="${h}" r="${r}" stroke-width="${stroke}"/><circle class="ring-fg ${cls}" ${id?`id="${id}"`:''} cx="${h}" cy="${h}" r="${r}" stroke-width="${stroke}" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${h} ${h})" data-c="${c}"/></svg>`;
}
function weekChart(dates,bd,today){
  const tot=d=>bd[d]?bd[d].planned+bd[d].focus:0;
  const max=Math.max(60,...dates.map(tot));
  return `<div class="wk">${dates.map(d=>{
    const v=bd[d]||{planned:0,focus:0},tt=v.planned+v.focus,h=tt?Math.max(4,tt/max*100):0;
    const label=`${fmtDate(d,{weekday:'long'})}: ${fmtDur(tt)}`;
    return `<div class="c" title="${esc(label)}"><div class="v num">${tt?esc(fmtDur(tt)):''}</div><div class="tr"><div class="bar" style="height:${h}%">${v.planned?`<i class="p" style="flex:${v.planned}"></i>`:''}${v.focus?`<i class="fo" style="flex:${v.focus}"></i>`:''}</div></div><div class="d ${d===today?'today':''}">${esc(fmtDate(d,{weekday:'short'}))}</div></div>`;
  }).join('')}</div>`;
}

function dueText(task,now){

  let s=diff===0?t('today'):diff===1?t('tomorrow'):diff===-1?t('yesterday'):fmtDate(task.dueDate,{weekday:'short',day:'numeric',month:'short'});

/* ---- focus timer ---- */
const T={mode:'focus',status:'idle',remaining:1500,total:1500,endAt:0,subjectId:'',restored:false};
const durFor=m=>(m==='focus'?focusMin():breakMin())*60;
const timerKey=()=>'sm.timer.'+S.uid;
function persistTimer(){if(S.uid)LS.set(timerKey(),JSON.stringify({mode:T.mode,status:T.status,remaining:T.remaining,total:T.total,endAt:T.endAt,subjectId:T.subjectId}))}
function restoreTimer(){
  if(T.restored||!S.uid||!S.profileLoaded)return;T.restored=true;
  let o=null;try{o=JSON.parse(LS.get(timerKey())||'null')}catch(e){}
  if(!o||!o.mode){T.total=T.remaining=durFor('focus');return}
  Object.assign(T,{mode:o.mode,status:o.status,remaining:o.remaining,total:o.total,endAt:o.endAt,subjectId:o.subjectId||''});
  if(T.status==='running'&&T.endAt<=Date.now())completeTimer(T.endAt);
  else if(T.status==='idle'){T.total=T.remaining=durFor(T.mode)}
}
let audio=null;
function unlockAudio(){try{if(!audio){const A=window.AudioContext||window.webkitAudioContext;if(A)audio=new A()}if(audio&&audio.state==='suspended')audio.resume()}catch(e){}}
function beep(){
  try{if(!audio)return;[0,0.28,0.56].forEach((d,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=i===2?1046:784;o.connect(g);g.connect(audio.destination);const s=audio.currentTime+d;g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(0.18,s+0.02);g.gain.exponentialRampToValueAtTime(0.0001,s+0.22);o.start(s);o.stop(s+0.25)})}catch(e){}
}
function completeTimer(endMs){
  const was=T.mode,mins=Math.max(1,Math.round(T.total/60));
  if(was==='focus')createItem('focus',{date:ymd(new Date(endMs||Date.now())),minutes:mins,subjectId:T.subjectId||null,endedAt:new Date(endMs||Date.now()).toISOString()});
  T.mode=was==='focus'?'break':'focus';T.status='idle';T.total=T.remaining=durFor(T.mode);T.endAt=0;persistTimer();
  if(endMs===undefined||Date.now()-endMs<5000){beep();toast(t(was==='focus'?'focusDone':'breakDone'))}
  if(S.view==='focus')renderMain();paintTimer();
}
function tick(){
  if(T.status!=='running')return;
  const rem=Math.ceil((T.endAt-Date.now())/1000);
  if(rem<=0){completeTimer(T.endAt);return}
  T.remaining=rem;paintTimer();
}
setInterval(tick,250);
const fmtClock=sec=>`${pad(Math.floor(sec/60))}:${pad(sec%60)}`;
function paintTimer(){
  const tx=$('#tText');if(tx)tx.textContent=fmtClock(T.remaining);
  const rg=$('#tRing');if(rg){const c=Number(rg.dataset.c),p=T.total?(T.total-T.remaining)/T.total:0;rg.setAttribute('stroke-dashoffset',c*(1-Math.min(1,Math.max(0,p))))}
  const mini=$('#mini');if(mini){mini.hidden=T.status==='idle'||S.view==='focus';const mt=$('#miniT');if(mt)mt.textContent=`${t(T.mode==='focus'?'fFocus':'fBreak')} ${fmtClock(T.remaining)}`}
}

function openModal({title,body,submitLabel,danger,extraLeft,onSubmit,hideCancel}){
  $('#modal').innerHTML=`<div class="mback" data-act="modal-bg"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="mt">
    <div class="dlg-h"><h2 id="mt">${esc(title)}</h2><button class="icon-btn sm" data-act="modal-close" aria-label="${esc(t('close'))}" type="button">${ic('x')}</button></div>

    <div class="dlg-f">${extraLeft?`<span class="left">${extraLeft}</span>`:''}${hideCancel?'':`<button class="btn" type="button" data-act="modal-close">${esc(t('cancel'))}</button>`}<button class="btn ${danger?'danger':'primary'}" type="submit" id="msubmit">${esc(submitLabel||t('save'))}</button></div></form></div></div>`;
  const f=$('#mform');
  f.addEventListener('submit',async e=>{e.preventDefault();const b=$('#msubmit');b.disabled=true;try{await onSubmit(f)}finally{if(b.isConnected)b.disabled=false}});
  const first=f.querySelector('input:not([type=radio]),select,textarea');if(first&&!first.disabled)first.focus();
}
const fv=id=>{const el=document.getElementById(id);return el?el.value:''};
function setErr(id,msg){
  const el=document.getElementById(id);if(!el)return;
  let box=document.getElementById('e-'+id);
  if(!box){box=document.createElement('div');box.className='err';box.id='e-'+id;el.closest('.f').appendChild(box)}
  box.textContent=msg||'';el.classList.toggle('bad',!!msg);
}

function subjectModal(id,preName){
  const x=id?S.subjects.find(v=>v.id===id):null,cur=x?x.color:COLORS[S.subjects.length%COLORS.length];
  openModal({title:t(x?'editSubject':'addSubject'),submitLabel:t('save'),body:`<div class="f"><label for="f-name">${esc(t('name'))}</label><input class="inp" id="f-name" maxlength="40" value="${esc(x?x.name:(preName||''))}"></div>
    <div class="f"><span class="lbl">${esc(t('color'))}</span><div class="swatches" role="radiogroup">${COLORS.map((c,i)=>`<span><input type="radio" name="f-color" id="c${i}" value="${c}" ${c===cur?'checked':''}><label for="c${i}" style="--c:${c}" aria-label="${c}"></label></span>`).join('')}</div></div>
    <div class="f"><label for="f-goal">${esc(t('weeklyGoal'))}</label><input class="inp" id="f-goal" type="number" min="0" max="80" step="0.5" value="${x&&x.weeklyGoalMin?x.weeklyGoalMin/60:''}"></div>`,
  onSubmit:async()=>{
    clearErrs();const name=fv('f-name').trim(),g=fv('f-goal');let bad=false;
    if(!name){setErr('f-name',t('required'));bad=true}
    const gh=g===''?0:Number(g);if(!Number.isFinite(gh)||gh<0||gh>80){setErr('f-goal',t('goalRange'));bad=true}
    if(bad)return;
    const color=(document.querySelector('input[name=f-color]:checked')||{}).value||COLORS[0];
    const data={name,color,weeklyGoalMin:Math.round(gh*60)};
    const ok=x?await putItem('subjects',x.id,data):await createItem('subjects',data);
    if(ok){closeModal();toast(t('saved'))}
  }});
}

function forgotModal(){
  openModal({title:t('forgotTitle'),submitLabel:t('eraseAccount'),danger:true,
    body:`<p class="muted">${esc(t('forgotBody'))}</p><div class="f"><label for="x-email">${esc(t('eraseTypeEmail'))}</label><input class="inp" id="x-email" type="email" dir="ltr" autocomplete="off" value="${esc((document.getElementById('a-email')||{}).value||'')}"></div>`,
    onSubmit:async()=>{clearErrs();const em=normEmail(fv('x-email')),u=getUsers()[em];if(!u){setErr('x-email',t('eraseNoMatch'));return}eraseUser(u);closeModal();toast(t('erased'))}});
}
function maybeOnboard(){
  if(S.onbShown||!S.profileLoaded||S.profile.onboarded)return;
  S.onbShown=true;
  const days=[6,0,1].map(d=>`<option value="${d}" ${(LANG==='ar'?6:1)===d?'selected':''}>${esc(new Intl.DateTimeFormat(LOC(),{weekday:'long'}).format(new Date(2024,0,7+d)))}</option>`).join('');
  openModal({title:t('welcome'),submitLabel:t('getStarted'),hideCancel:true,body:`<p class="muted">${esc(t('welcomeSub'))}</p>
    <div class="f"><label for="o-name">${esc(t('displayName'))}</label><input class="inp" id="o-name" maxlength="60" value="${esc((S.me&&S.me.name)||'')}"></div>
    <div class="f"><label for="o-ws">${esc(t('weekStart'))}</label><select class="inp" id="o-ws">${days}</select></div>`,
  onSubmit:async()=>{saveProfile({name:fv('o-name').trim(),weekStart:Number(fv('o-ws')),lang:LANG,theme:THEME,onboarded:true});closeModal();updateChrome()}});
}

/* ================= events ================= */
const ACT={
  nav:el=>setView(el.dataset.view),
  'menu-open':()=>{S.menu=true;updateChrome()},
  'menu-close':()=>{S.menu=false;updateChrome()},
  logout:()=>logout(),
  'auth-mode':el=>{captureDraft();S.authMode=el.dataset.mode;renderAuth();const f=document.getElementById(S.authMode==='up'?'a-name':'a-email');if(f)f.focus()},
  'toggle-pw':el=>{const i=document.getElementById(el.dataset.t);if(!i)return;const show=i.type==='password';i.type=show?'text':'password';el.innerHTML=ic(show?'eyeoff':'eye','sm');el.setAttribute('aria-label',t(show?'hidePw':'showPw'))},
  forgot:()=>forgotModal(),
  'delete-account':()=>{const u={id:S.me.id,email:S.me.email};confirmModal(t('delAccount'),t('delAccountMsg'),async()=>{logout(true);store.del('sm.session');eraseUser(u);toast(t('erased'))})},
  lang:()=>setLang(LANG==='ar'?'en':'ar',true),
  'set-lang':el=>setLang(el.dataset.lang,true),
  theme:()=>setTheme(isDark()?'light':'dark',true),
  'set-theme':el=>{setTheme(el.dataset.theme,true);renderMain()},
  'modal-close':()=>closeModal(),
  'modal-bg':(el,id,e)=>{if(e.target===el)closeModal()},
  'add-task':()=>taskModal(),
  'edit-task':(el,id)=>taskModal(id),
  'del-task':(el,id)=>{const x=S.tasks.find(v=>v.id===id);if(x)confirmModal(t('delTask'),t('delTaskMsg',{name:x.title}),()=>removeItem('tasks',id))},
  'toggle-task':async(el,id)=>{const x=S.tasks.find(v=>v.id===id);if(!x)return;const done=x.status==='completed';await patchItem('tasks',id,{status:done?'pending':'completed',completedAt:done?null:new Date().toISOString()})},
  'show-overdue':()=>{S.tf={q:'',status:'overdue',priority:'all',subject:'all'};setView('tasks')},
  'add-session':(el)=>sessionModal(null,el.dataset.date),
  'edit-session':(el,id)=>sessionModal(id),
  'del-session':(el,id)=>confirmModal(t('delSession'),t('delSessionMsg'),()=>removeItem('sessions',id)),
  'toggle-session':async(el,id)=>{const x=S.sessions.find(v=>v.id===id);if(!x)return;await patchItem('sessions',id,{completed:!x.completed,completedAt:x.completed?null:new Date().toISOString()})},
  'dur-chip':el=>{const i=$('#f-dur');if(i)i.value=el.dataset.m},
  'pl-prev':()=>{S.plannerDate=addDays(S.plannerDate,S.plannerMode==='week'?-7:-1);renderMain()},
  'pl-next':()=>{S.plannerDate=addDays(S.plannerDate,S.plannerMode==='week'?7:1);renderMain()},
  'pl-today':()=>{S.plannerDate=todayStr();renderMain()},
  'pl-mode':el=>{S.plannerMode=el.dataset.mode;renderMain()},
  'pg-prev':()=>{S.progressDate=addDays(S.progressDate,-7);renderMain()},
  'pg-next':()=>{S.progressDate=addDays(S.progressDate,7);renderMain()},
  'add-subject':()=>subjectModal(),
  'edit-subject':(el,id)=>subjectModal(id),
  'suggest-subject':el=>subjectModal(null,t('suggest')[Number(el.dataset.i)]),
  'del-subject':(el,id)=>{const x=S.subjects.find(v=>v.id===id);if(!x)return;
    confirmModal(t('delSubject'),t('delSubjectMsg',{name:x.name}),async()=>{
      for(const n of ['tasks','sessions','focus'])for(const it of S[n].filter(v=>v.subjectId===id))await patchItem(n,it.id,{subjectId:null});
      if(T.subjectId===id){T.subjectId='';persistTimer()}
      await removeItem('subjects',id);
    })},
  'del-focus':(el,id)=>{removeItem('focus',id)},
  't-mode':el=>{if(T.status==='running')return;T.mode=el.dataset.mode;T.total=T.remaining=durFor(T.mode);T.status='idle';persistTimer();renderMain()},
  't-start':()=>{unlockAudio();if(T.status==='idle'){T.remaining=T.total=durFor(T.mode)}T.endAt=Date.now()+T.remaining*1000;T.status='running';persistTimer();renderMain();paintTimer()},
  't-pause':()=>{if(T.status!=='running')return;T.remaining=Math.max(1,Math.ceil((T.endAt-Date.now())/1000));T.status='paused';persistTimer();renderMain()},
  't-reset':()=>{T.status='idle';T.total=T.remaining=durFor(T.mode);T.endAt=0;persistTimer();renderMain()},
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const fn=ACT[el.dataset.act];if(fn){fn(el,el.dataset.id,e)}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#modal').firstChild)closeModal();else if(S.menu){S.menu=false;updateChrome()}return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button][data-act]')){e.preventDefault();e.target.click()}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.input==='tq'){S.tf.q=el.value;const l=$('#taskList');if(l)l.innerHTML=taskListHtml(new Date())}
});
document.addEventListener('change',e=>{
  const el=e.target,a=el.dataset&&el.dataset.change;if(!a)return;
  if(a==='tf'){S.tf[el.dataset.key]=el.value;const l=$('#taskList');if(l)l.innerHTML=taskListHtml(new Date())}
  else if(a==='task-status'){const st=el.value;patchItem('tasks',el.dataset.id,{status:st,completedAt:st==='completed'?new Date().toISOString():null})}
  else if(a==='t-subject'){T.subjectId=el.value;persistTimer()}
  else if(a==='t-set'){
    const k=el.dataset.key,[lo,hi]=k==='focusMin'?[1,180]:[1,60],v=Number(el.value);
    if(!Number.isFinite(v)||Math.round(v)!==v||v<lo||v>hi){toast(t('minRange',{a:lo,b:hi}),true);el.value=k==='focusMin'?focusMin():breakMin();return}
    saveProfile({[k]:v});
    if(T.status==='idle'){T.total=T.remaining=durFor(T.mode);persistTimer();renderMain()}
  }
});
document.addEventListener('submit',e=>{
  if(e.target.id==='authform'){e.preventDefault();onAuthSubmit(e.target);return}
  if(e.target.id==='setform'){
    e.preventDefault();
    saveProfile({name:fv('s-name').trim(),weekStart:Number(fv('s-ws'))});updateChrome();toast(t('saved'));
  }
});

/* ================= boot ================= */
LANG=LS.get('sm.lang')||((navigator.language||'').toLowerCase().startsWith('ar')?'ar':'en');
if(LANG!=='ar'&&LANG!=='en')LANG='en';
THEME=LS.get('sm.theme')||'system';if(!['light','dark','system'].includes(THEME))THEME='system';
applyChrome();
init();
})();
</script>
